<script>

  const add=t=>()=>{bl.push(t==="text"?{type:t,title:"New heading",body:""}:t==="media"?{type:t,url:"/img/cctv.png",caption:""}:t==="gallery"?{type:t,title:"",urls:[]}:{type:t,title:"Call to action",label:"Get in touch",target:"contact"});mark();render()};
  return[el("div",{class:"card"},el("h3",{},"Page components"),el("p",{},"Pick a page, then add components. They appear at the bottom of that page."),sel,el("div",{class:"row"},["text","media","gallery","cta"].map(t=>el("button",{class:"btn s p",onclick:add(t)},"+ "+({text:"Text",media:"Image / GIF / Video",gallery:"Gallery",cta:"Button"}[t]))))),
  ...bl.map((b,i)=>el("div",{class:"card"},el("span",{class:"tag"},b.type),
   b.type==="text"?[fld("Heading",b,"title"),fld("Text",b,"body",1)]:b.type==="media"?[mfld("Media",b,"url"),fld("Caption",b,"caption")]:b.type==="gallery"?[fld("Heading",b,"title"),mediaLists("Gallery items",b.urls=b.urls||[])]:[fld("Heading",b,"title"),fld("Button label",b,"label"),el("label",{class:"f"},el("span",{},"Opens page"),(()=>{const s=el("select");["contact","about","services","branches"].forEach(p=>s.append(el("option",{value:p,...(p===b.target?{selected:""}:{})},p)));s.onchange=()=>{b.target=s.value;mark()};return s})())],ctl(bl,i)))]},

  async function draw(){let l=[];try{l=await (await api("GET","/api/admin/media")).json()}catch(e){}g.replaceChildren(...l.map(m=>el("div",{class:"mi"},el("div",{class:"pv"},prev(m.url)),el("small",{},m.name+" · "+(m.size/1024).toFixed(0)+" KB"),el("div",{class:"row"},el("button",{class:"btn s",onclick:()=>navigator.clipboard.writeText(location.origin+m.url)},"Copy URL"),el("button",{class:"btn s d",onclick:async()=>{if(confirm("Delete "+m.name+"?")){await api("DELETE","/api/admin/media?name="+encodeURIComponent(m.name));draw()}}},"Delete")))));if(!l.length)g.append("No uploads yet.")}draw();return[c]},
 backup:()=>[el("div",{class:"card"},el("h3",{},"Backup & reset"),el("div",{class:"row"},el("button",{class:"btn s",onclick:()=>{const a=el("a",{href:URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"})),download:"topform-content.json"});a.click()}},"Download content backup"),el("label",{class:"btn s"},"Restore from file",el("input",{type:"file",accept:"application/json",hidden:"",onchange:async e=>{try{D=merge(JSON.parse(await e.target.files[0].text()));mark();render()}catch(x){alert("Invalid file")}}})),el("button",{class:"btn s d",onclick:()=>{if(confirm("Reset ALL text, lists and images to the original defaults? (uploaded files stay in the library)")){D=merge({});mark();render()}}},"Reset to defaults")))]
